<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111619"><meta name="description" content="AstroForge 2.0 Lite — Triebwerksvorentwurf auf einer gemeinsamen Arbeitsfläche."><title>AstroForge 2.0 Lite · Engine design workspace</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./src/styles.css"></head>
<body data-mobile-panel="canvas">
<header class="app-header"><a class="brand" href="./" aria-label="AstroForge Start"><span class="brand-mark">A<span>F</span></span><span class="brand-copy">AstroForge <span class="edition">2.5 LITE</span></span></a><button id="project-name" class="project-name" title="Projekt umbenennen">AF–01 / Pressure-fed</button><div class="header-actions"><button class="button button-quiet" id="new-project">Vorlage</button><button class="button button-quiet" id="open-project">Öffnen</button><button class="button button-quiet" id="save-project">Speichern</button><button class="icon-button" id="help" aria-label="Hilfe und Modellgrenzen">?</button><button class="button button-primary" id="run">Berechnen <span aria-hidden="true">↗</span></button></div></header>
<div class="workspace">
<aside class="sidebar" aria-label="Komponentenbibliothek"><div class="panel-title"><span>WORKSPACE</span><span class="badge">01</span></div><button class="tree-item" id="design-select">Triebwerksentwurf <span>↗</span></button><div class="section-label">KOMPONENTEN</div><div class="palette" id="palette"></div><div class="section-label">SYSTEMSTRUKTUR</div><nav class="tree" id="tree"></nav><div class="sidebar-note"><span class="status-dot"></span> Lokal auf deinem Gerät<p>LOX / RP-1 · stationärer Vorentwurf</p></div></aside>
<main class="main-stage"><div class="stage-toolbar"><nav class="breadcrumbs" id="breadcrumbs" aria-label="Section-Navigation"></nav><div class="stage-actions"><button class="icon-button" id="undo" aria-label="Rückgängig" title="Rückgängig (Strg+Z)">↶</button><button class="icon-button" id="redo" aria-label="Wiederholen" title="Wiederholen (Strg+Y)">↷</button><span class="toolbar-divider"></span><button class="button button-quiet" id="fit">Einpassen</button><button class="icon-button" id="delete-node" aria-label="Ausgewählte Komponente löschen" title="Komponente löschen">⌫</button></div></div><section id="engine-section" class="engine-section" hidden aria-label="Kühlstrecke und Strömungsrichtung"></section><div class="canvas-host" id="canvas" aria-label="Triebwerkssystem"></div><div class="canvas-footer"><span><i class="legend-dot ox"></i> Oxidator <i class="legend-dot fuel"></i> Brennstoff <i class="legend-dot gas"></i> Heißgas <i class="legend-dot mechanical"></i> Welle</span><span id="canvas-hint">Bauteil auswählen · Ports zum Verbinden anklicken</span></div></main>
<aside class="inspector" aria-label="Eigenschaften"><div class="inspector-header"><span class="section-label">INSPECTOR</span><span id="selection-tag" class="badge">DESIGN</span></div><div class="inspector-body" id="inspector"></div></aside>
</div>
<section class="results-strip" aria-label="Berechnungsergebnisse" id="results"></section>
<nav class="mobile-nav" aria-label="Arbeitsbereich"><button data-panel="library">Bauteile</button><button data-panel="canvas" aria-current="page">System</button><button data-panel="inspector">Details</button><button data-panel="results">Ergebnisse</button></nav>
<div class="toast" id="toast" role="status" hidden></div><input type="file" id="file-input" accept=".json,application/json" hidden><dialog class="dialog" id="dialog"></dialog>
<script type="module" src="./src/app.js"></script>
</body></html>
